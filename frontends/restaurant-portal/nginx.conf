server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # ADR-0045: tokens live in memory, so no script may run but the portal's own bundle
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8180; frame-ancestors 'none'" always;

    location / {
        try_files $uri /index.html;
    }
}
