static_resources:
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison:
                            {
                              op: EQ,
                              value: { default_value: 503, runtime_key: edge.local_reply.503 },
                            }
                      body_format_override:
                        content_type: application/problem+json
                        json_format:
                          {
                            type: about:blank,
                            title: Service Unavailable,
                            status: '%RESPONSE_CODE%',
                          }
                    - filter:
                        status_code_filter:
                          comparison:
                            {
                              op: EQ,
                              value: { default_value: 504, runtime_key: edge.local_reply.504 },
                            }
                      body_format_override:
                        content_type: application/problem+json
                        json_format:
                          { type: about:blank, title: Gateway Timeout, status: '%RESPONSE_CODE%' }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: edge
                  virtual_hosts:
                    - name: consumer-api
                      domains: ['*']
                      routes:
                        # ADR-0014 and ADR-0037: placements without Idempotency-Key never reach the BFF
                        - match:
                            path: /v1/orders
                            headers:
                              - name: ':method'
                                string_match: { exact: POST }
                              - name: idempotency-key
                                present_match: false
                          direct_response:
                            status: 400
                            body:
                              inline_string: '{"type":"about:blank","title":"Bad Request","status":400,"detail":"the Idempotency-Key header is required"}'
                          response_headers_to_add:
                            - header: { key: content-type, value: application/problem+json }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match: { prefix: / }
                          route: { cluster: consumer-bff }
  clusters:
    - name: consumer-bff
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options: { idle_timeout: 60s }
          explicit_http_config: { http_protocol_options: {} }
      load_assignment:
        cluster_name: consumer-bff
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: consumer-bff, port_value: 4000 }
