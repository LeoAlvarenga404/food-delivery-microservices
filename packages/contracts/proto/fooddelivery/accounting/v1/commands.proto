syntax = "proto3";

package fooddelivery.accounting.v1;

message AuthorizePayment {
  string order_id = 1;
  string consumer_id = 2;
  int64 amount_in_cents = 3;
  string currency = 4;
  string payment_token = 5;
  string restaurant_id = 6;
  int64 delivery_fee_in_cents = 7;
}

message VoidAuthorization {
  string order_id = 1;
}
