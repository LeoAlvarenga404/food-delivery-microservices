syntax = "proto3";

package fooddelivery.restaurant.v1;

import "google/protobuf/timestamp.proto";

enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_MONDAY = 1;
  DAY_OF_WEEK_TUESDAY = 2;
  DAY_OF_WEEK_WEDNESDAY = 3;
  DAY_OF_WEEK_THURSDAY = 4;
  DAY_OF_WEEK_FRIDAY = 5;
  DAY_OF_WEEK_SATURDAY = 6;
  DAY_OF_WEEK_SUNDAY = 7;
}

message GeoPoint {
  double latitude = 1;
  double longitude = 2;
}

message Address {
  string street = 1;
  string number = 2;
  string city = 3;
  string postal_code = 4;
  GeoPoint location = 5;
}

message OpeningPeriod {
  DayOfWeek day_of_week = 1;
  string opens_at = 2;
  string closes_at = 3;
}

message MenuItem {
  string menu_item_id = 1;
  string name = 2;
  int64 price_in_cents = 3;
  bool is_available = 4;
}

message Restaurant {
  string restaurant_id = 1;
  int32 version = 2;
  string name = 3;
  string category = 4;
  Address address = 5;
  string time_zone = 6;
  repeated OpeningPeriod opening_hours = 7;
  int64 minimum_order_in_cents = 8;
  string currency = 9;
  repeated MenuItem menu_items = 10;
}

message MenuRevised {
  Restaurant restaurant = 1;
  google.protobuf.Timestamp revised_at = 2;
}
