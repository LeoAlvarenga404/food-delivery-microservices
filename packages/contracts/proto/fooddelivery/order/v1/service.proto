syntax = "proto3";

package fooddelivery.order.v1;

import "fooddelivery/order/v1/events.proto";

service OrderService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_APPROVAL_PENDING = 1;
  ORDER_STATUS_APPROVED = 2;
  ORDER_STATUS_REJECTED = 3;
}

message RequestedLineItem {
  string menu_item_id = 1;
  int32 quantity = 2;
}

message DeliveryAddress {
  string street = 1;
  string number = 2;
  string city = 3;
  string postal_code = 4;
}

message PlaceOrderRequest {
  string idempotency_key = 1;
  string consumer_id = 2;
  string restaurant_id = 3;
  repeated RequestedLineItem line_items = 4;
  DeliveryAddress delivery_address = 5;
  string payment_token = 6;
}

message PlaceOrderResponse {
  string order_id = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  string order_id = 1;
  OrderStatus status = 2;
  repeated OrderLineItem line_items = 3;
  int64 total_in_cents = 4;
  string currency = 5;
}
