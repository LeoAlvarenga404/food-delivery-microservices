syntax = "proto3";

package fooddelivery.order.v1;

import "google/protobuf/timestamp.proto";

message OrderLineItem {
  string menu_item_id = 1;
  string name = 2;
  int64 unit_price_in_cents = 3;
  int32 quantity = 4;
}

message OrderPlaced {
  string order_id = 1;
  string consumer_id = 2;
  string restaurant_id = 3;
  repeated OrderLineItem line_items = 4;
  int64 total_in_cents = 5;
  string currency = 6;
  google.protobuf.Timestamp placed_at = 7;
}

message OrderApproved {
  string order_id = 1;
  google.protobuf.Timestamp approved_at = 2;
}

enum OrderRejectionReason {
  ORDER_REJECTION_REASON_UNSPECIFIED = 0;
  ORDER_REJECTION_REASON_CONSUMER_NOT_FOUND = 1;
  ORDER_REJECTION_REASON_CONSUMER_BLOCKED = 2;
  ORDER_REJECTION_REASON_TICKET_REFUSED = 3;
  ORDER_REJECTION_REASON_PAYMENT_DECLINED = 4;
  ORDER_REJECTION_REASON_CONSUMER_VERIFICATION_TIMED_OUT = 5;
  ORDER_REJECTION_REASON_TICKET_CREATION_TIMED_OUT = 6;
  ORDER_REJECTION_REASON_PAYMENT_AUTHORIZATION_TIMED_OUT = 7;
}

message OrderRejected {
  string order_id = 1;
  OrderRejectionReason reason = 2;
  google.protobuf.Timestamp rejected_at = 3;
}
